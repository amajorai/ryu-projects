# GENERATED by tools/mirror-satellites.sh — edit there, not here.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.0.6)'
        required: true

permissions:
  contents: write

jobs:
  notes:
    name: Release notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The changelog diffs against the previous tag — needs full history.
          fetch-depth: 0
      - name: Generate and publish DeepSeek V4.1 Flash release notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_MODEL: deepseek-v4.1-flash
          OPENCODE_MAX_TOKENS: "16000"
          OPENCODE_SESSION_ID: "ryu-${{ github.repository }}-${{ github.run_id }}"
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving its AI notes unchanged."
            exit 0
          fi
          node scripts/rolling-notes.mjs --channel release --repo "$GITHUB_REPOSITORY" --require-ai > ai-notes.md
          # Notes are built into a file rather than passed as a multi-line
          # --notes string: inside a `run: |` block scalar EVERY line must stay
          # indented, and a quoted string continuing at column 0 silently ends
          # the block and makes the whole workflow file invalid.
          {
            printf 'Built from commit `%s`.\n\n' "${GITHUB_SHA:0:7}"
            cat ai-notes.md
          } > release-notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --prerelease=false --latest --notes-file release-notes.md
          else
            gh release create "$TAG" --latest --title "ryu-projects $TAG" --target "$GITHUB_SHA" --notes-file release-notes.md
          fi

  build:
    needs: notes
    name: bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Package the prebuilt companion bundle
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          if [ -f ui/dist/index.html ]; then
            mkdir -p out
            tar -czf "out/ryu-projects-ui-${TAG}.tar.gz" manifest.json ui/dist
            ( cd out; sha256sum "ryu-projects-ui-${TAG}.tar.gz" > "ryu-projects-ui-${TAG}.tar.gz.sha256" )
          elif [ ! -d dist ]; then
            echo "No prebuilt Companion bundle is carried by this source-only UI satellite."
            exit 0
          else
          test -d dist || { echo "no dist/ in this satellite" >&2; exit 1; }
          mkdir -p out
          tar -czf "out/ryu-projects-ui-${TAG}.tar.gz" -C dist .
          cp dist/* out/ 2>/dev/null || true
          fi
          ( cd out
            for f in *; do
              case "$f" in *.sha256) continue ;; esac
              if command -v sha256sum >/dev/null 2>&1; then sha256sum "$f" > "$f.sha256"
              elif command -v shasum >/dev/null 2>&1; then shasum -a 256 "$f" > "$f.sha256"; fi
            done )
          ls -la out
      # gh release upload, NOT softprops: softprops PATCHes the release even
      # when it is only ADDING assets, and that PATCH is refused for the App
      # token ("Resource not accessible by integration") despite Contents:
      # write. The assets endpoint on its own is permitted.
      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d dist ]; then
            echo "No prebuilt Companion bundle is carried by this source-only UI satellite."
            exit 0
          fi
          shopt -s nullglob
          files=(out/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no files matched" >&2; exit 1
          fi
          gh release upload "$TAG" "${files[@]}" --clobber
